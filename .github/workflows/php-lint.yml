name: PHP syntax check

on:
  pull_request:
    paths:
      - '**/*.php'
      - '.github/workflows/php-lint.yml'
  push:
    branches: [main]
    paths:
      - '**/*.php'
      - '.github/workflows/php-lint.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
